name: SOC Lab Tests
on:
  push:
    paths:
      - "soc-lab/**"
      - ".github/workflows/soc-lab-tests.yml"
  pull_request:
    paths:
      - "soc-lab/**"
      - ".github/workflows/soc-lab-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soc-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
